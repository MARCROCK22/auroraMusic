name: Android ARM64 release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK packages
        shell: pwsh
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.8
          channel: stable
          cache: true

      - name: Verify signing secrets and restore release keystore
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          $required = @('ANDROID_KEYSTORE_BASE64', 'ANDROID_STORE_PASSWORD', 'ANDROID_KEY_PASSWORD', 'ANDROID_KEY_ALIAS')
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) {
            throw "Missing required GitHub Actions secrets: $($missing -join ', '). Configure all four Android release signing secrets."
          }
          $androidDirectory = Join-Path $env:GITHUB_WORKSPACE 'android'
          $keystorePath = Join-Path $androidDirectory 'ci-release.jks'
          [IO.File]::WriteAllBytes($keystorePath, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          $properties = @(
            "storePassword=$($env:ANDROID_STORE_PASSWORD)"
            "keyPassword=$($env:ANDROID_KEY_PASSWORD)"
            "keyAlias=$($env:ANDROID_KEY_ALIAS)"
            "storeFile=$($keystorePath -replace '\\', '/')"
          ) -join "`n"
          [IO.File]::WriteAllText((Join-Path $androidDirectory 'key.properties'), $properties + "`n", [Text.UTF8Encoding]::new($false))

      - name: Rebuild pinned FFmpeg WebP libraries for 16 KB pages
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME
          if ([string]::IsNullOrWhiteSpace($sdk)) { $sdk = $env:ANDROID_SDK_ROOT }
          if ([string]::IsNullOrWhiteSpace($sdk)) { throw 'Android SDK path is not set by setup-android.' }
          ./scripts/rebuild_android_webp.ps1 -SdkDirectory $sdk

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build signed ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify signature, release manifest, and 16 KB alignment
        shell: pwsh
        run: |
          $apk = Join-Path $env:GITHUB_WORKSPACE 'build/app/outputs/flutter-apk/app-release.apk'
          $sdk = $env:ANDROID_HOME
          if ([string]::IsNullOrWhiteSpace($sdk)) { $sdk = $env:ANDROID_SDK_ROOT }
          if ([string]::IsNullOrWhiteSpace($sdk)) { throw 'Android SDK path is not set by setup-android.' }
          $buildTools = Join-Path $sdk 'build-tools/36.1.0'
          $cmdlineTools = Join-Path $sdk 'cmdline-tools/latest/bin'
          & (Join-Path $buildTools 'apksigner.bat') verify --verbose --print-certs $apk
          if ($LASTEXITCODE -ne 0) { throw 'APK signature verification failed.' }
          $debuggable = & (Join-Path $cmdlineTools 'apkanalyzer.bat') manifest debuggable $apk
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect APK debuggable flag.' }
          if ($debuggable.Trim() -ne 'false') { throw "Release APK is debuggable: $debuggable" }
          ./scripts/verify_android_alignment.ps1 -Apk $apk -SdkDirectory $sdk

      - name: Copy release APK and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'dist/android' -Force | Out-Null
          $source = 'build/app/outputs/flutter-apk/app-release.apk'
          $destination = 'dist/android/Aurora-Android-ARM64.apk'
          Copy-Item -LiteralPath $source -Destination $destination -Force
          $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'dist/android/Aurora-Android-ARM64.apk.sha256'), "$hash  Aurora-Android-ARM64.apk`n", [Text.UTF8Encoding]::new($false))

      - name: Upload Android release APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Android-ARM64
          path: |
            dist/android/Aurora-Android-ARM64.apk
            dist/android/Aurora-Android-ARM64.apk.sha256
          if-no-files-found: error
          compression-level: 0
