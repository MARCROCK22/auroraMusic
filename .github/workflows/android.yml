name: Android ARM64 release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: Android build
        type: choice
        options: [release, debug]
        default: release

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.build_type == 'release')
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Consultar la fuente
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar el SDK de Android
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar paquetes del SDK de Android
        shell: pwsh
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.8
          channel: stable
          cache: true

